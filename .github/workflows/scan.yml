name: Scanner Workflow

on:
  workflow_dispatch:
  push:
    branches: 
     - master
     
jobs:
  scan_routine:
    name: Scanner Routine
    runs-on: ubuntu-latest
    
    steps:
    # Runs a single command using the runners shell
    - name: Clone the repository
      uses: actions/checkout@v3
      
    - name: Scan Images Folder
      uses: alexavil/folder-scanner@d7664340b5d635c6a8636eacc4e89e064c34fc46
      with:
          folder: ./assets/img
          json_name: files.json

    - name: Scan Videos Folder
      uses: alexavil/folder-scanner@d7664340b5d635c6a8636eacc4e89e064c34fc46
      with:
          folder: ./assets/vid
          json_name: files.json
