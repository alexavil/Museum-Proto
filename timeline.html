<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快……了 / 就要……了</title>
<style>
:root {
  --bg: #fdf8f0;
  --ink: #2a2233;
  --muted: #7a6f82;
  --good: #1f9d55;
  --bad: #e0453a;
  --accent: #5b4bdb;
  --shadow: 0 4px 0 rgba(42,34,51,.12), 0 10px 24px rgba(42,34,51,.10);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 10% 10%, #ffe9d6 0, transparent 35%),
                    radial-gradient(circle at 90% 90%, #e3e9ff 0, transparent 40%);
  color: var(--ink);
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  display: flex; flex-direction: column;
  user-select: none; -webkit-user-select: none;
  overflow-x: hidden;
}
header { padding: 16px 24px 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
h1 { margin: 0; font-size: clamp(22px, 2.6vw, 34px); letter-spacing: 1px; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: clamp(13px, 1.2vw, 16px); }
.controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit; font-size: clamp(14px, 1.2vw, 17px); font-weight: 700;
  border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer;
  background: #fff; color: var(--ink); box-shadow: 0 3px 0 rgba(42,34,51,.18);
  transition: transform .1s;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(42,34,51,.18); }
button.primary { background: var(--accent); color: #fff; }
button.on { background: #2a2233; color: #fff; }
.arrow {
  margin: 4px 24px 10px; display: flex; align-items: center; gap: 12px;
  font-weight: 700; font-size: clamp(15px, 1.4vw, 20px);
}
.arrow .line { flex: 1; height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, #ffb347, #ff6f91, #845ec2); position: relative; }
.arrow .line::after { content: ""; position: absolute; right: -4px; top: -7px;
  border-left: 16px solid #845ec2; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
main { flex: 1; padding: 0 24px 16px; display: flex; }
.board {
  flex: 1; display: grid; gap: clamp(8px, 1.2vw, 16px);
  grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr;
}
.card {
  position: relative; border-radius: 20px; background: var(--c);
  box-shadow: var(--shadow); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  padding: 10px 6px 12px; cursor: grab; touch-action: none;
  border: 4px solid transparent; min-height: 120px;
}
.card svg { width: clamp(48px, 6vw, 92px); height: auto; flex-shrink: 0; }
.card .name { font-size: clamp(22px, 2.5vw, 38px); font-weight: 800; line-height: 1.1; text-align: center; }
.card .py { font-size: clamp(11px, 1vw, 15px); color: rgba(42,34,51,.7); display: none; font-family: "Segoe UI", Arial, sans-serif; }
body.show-py .card .py { display: block; }
.card .num {
  position: absolute; top: 8px; left: 10px; width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.85); font-weight: 800; font-size: 15px;
  display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Arial, sans-serif;
}
.card .mark { position: absolute; top: 6px; right: 10px; font-size: 26px; font-weight: 900; display: none; }
.card.good { border-color: var(--good); }
.card.good .mark { display: block; color: var(--good); }
.card.bad { border-color: var(--bad); animation: shake .4s; }
.card.bad .mark { display: block; color: var(--bad); }
.card.dragging { z-index: 50; cursor: grabbing; box-shadow: 0 18px 40px rgba(42,34,51,.3); transition: none !important; }
.card.dragging { transform-origin: center; }
@keyframes shake { 0%,100% { translate: 0 } 25% { translate: -6px 0 } 75% { translate: 6px 0 } }

.toast {
  position: fixed; left: 50%; top: 14px; transform: translateX(-50%) translateY(-140px);
  background: #2a2233; color: #fff; font-size: clamp(18px, 2vw, 26px); font-weight: 800;
  padding: 14px 28px; border-radius: 16px; transition: transform .3s; z-index: 100; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }


.confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 150; pointer-events: none;
  animation: fall linear forwards; border-radius: 3px; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

@media (max-width: 800px) {
  .board { grid-template-columns: repeat(3, 1fr); }
  header, .arrow, main { padding-left: 12px; padding-right: 12px; }
  .arrow { margin-left: 12px; margin-right: 12px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>快……了 / <span>就要……了</span></h1>
  </div>
  <div class="controls">
    <button class="primary" id="check">Check</button>
    <button id="shuffle">Shuffle</button>
    <button id="answer">Answer</button>
    <button id="py">Pinyin</button>
  </div>
</header>
<div class="arrow"><span>最近 · 现在</span><div class="line"></div><span>最远 · 明年</span></div>
<main><div class="board" id="board"></div></main>

const board = document.getElementById('board');
const toastEl = document.getElementById('toast');
let toastTimer;

function makeCard(d, i) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.i = i;
  el.style.setProperty('--c', d.c);
  el.innerHTML = `<div class="num"></div><div class="mark"></div>${ICONS[d.icon]}<div class="name">${d.n}</div><div class="py">${d.py}</div>`;
  // Give each snowflake its own id so <use> references stay valid.
  el.innerHTML = el.innerHTML.replace(/id="arm"/g, `id="arm${i}"`).replace(/#arm"/g, `#arm${i}"`);
  el.addEventListener('pointerdown', onDown);
  return el;
}

function cards() { return [...board.children]; }
function renumber() { cards().forEach((c, k) => c.querySelector('.num').textContent = k + 1); }
function clearMarks() { cards().forEach(c => { c.classList.remove('good', 'bad'); c.querySelector('.mark').textContent = ''; }); }

// Animate layout changes (FLIP).
function flip(mutate, skip) {
  const before = new Map(cards().map(c => [c, c.getBoundingClientRect()]));
  mutate();
  cards().forEach(c => {
    if (c === skip) return;
    const a = before.get(c), b = c.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    c.style.transition = 'none';
    c.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      c.style.transition = 'transform .3s cubic-bezier(.2,.8,.2,1)';
      c.style.transform = '';
    }));
  });
  renumber();
}

function isSorted(order) { return order.every((v, k) => v === k); }

function shuffle() {
  let order;
  do { order = CARDS.map((_, k) => k).sort(() => Math.random() - .5); }
  while (isSorted(order) || order.filter((v, k) => v === k).length > 2);
  const map = new Map(cards().map(c => [+c.dataset.i, c]));
  flip(() => order.forEach(k => board.appendChild(map.get(k))));
  clearMarks();
}

function showAnswer() {
  const sorted = cards().sort((a, b) => a.dataset.i - b.dataset.i);
  flip(() => sorted.forEach(c => board.appendChild(c)));
  setTimeout(check, 350);
}

function check() {
  let ok = 0;
  cards().forEach((c, k) => {
    c.classList.remove('good', 'bad');
    void c.offsetWidth;
    const right = +c.dataset.i === k;
    c.classList.add(right ? 'good' : 'bad');
    c.querySelector('.mark').textContent = right ? '✓' : '✗';
    if (right) ok++;
  });
  if (ok === CARDS.length) { toast('全对了！太棒了！ 🎉'); confetti(); }
  else toast(`${ok} / ${CARDS.length} 对了 · 再试试！`);
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function confetti() {
  const colors = ['#e8574b', '#f6c343', '#3b8fd9', '#3aa76d', '#845ec2', '#ff8fa3'];
  for (let k = 0; k < 90; k++) {
    const p = document.createElement('div');
    p.className = 'confetti';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[k % colors.length];
    p.style.animationDuration = 1.8 + Math.random() * 1.8 + 's';
    p.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4500);
  }
}

// Dragging with pointer events (mouse, touch, interactive whiteboards).
let drag = null;
function onDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  const el = e.currentTarget;
  const r = el.getBoundingClientRect();
  drag = { el, x0: e.clientX, y0: e.clientY, offX: e.clientX - r.left, offY: e.clientY - r.top, moved: false };
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
}

function place(e) {
  const el = drag.el;
  el.style.transform = '';
  const r = el.getBoundingClientRect();
  el.style.transform = `translate(${e.clientX - drag.offX - r.left}px, ${e.clientY - drag.offY - r.top}px) scale(1.05)`;
}

function onMove(e) {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true;
    drag.el.classList.add('dragging');
    clearMarks();
  }
  const el = drag.el;
  const target = cards().find(c => {
    if (c === el) return false;
    const r = c.getBoundingClientRect();
    return e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom;
  });
  if (target) {
    const list = cards();
    const from = list.indexOf(el), to = list.indexOf(target);
    flip(() => board.insertBefore(el, from < to ? target.nextSibling : target), el);
  }
  place(e);
}

function onUp(e) {
  if (!drag) return;
  const { el, moved } = drag;
  el.removeEventListener('pointermove', onMove);
  el.removeEventListener('pointerup', onUp);
  el.removeEventListener('pointercancel', onUp);
  drag = null;
  if (!moved) return;
  el.classList.remove('dragging');
  el.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)';
  el.style.transform = '';
  renumber();
}


document.getElementById('check').onclick = check;
document.getElementById('shuffle').onclick = shuffle;
document.getElementById('answer').onclick = showAnswer;
document.getElementById('py').onclick = e => {
  document.body.classList.toggle('show-py');
  e.currentTarget.classList.toggle('on');
};

CARDS.forEach((d, i) => board.appendChild(makeCard(d, i)));
renumber();
shuffle();
</script>
